            const addEvidence = (data, type) => {
                // v84.9.4: ALL manual photos captured by assessor go to 'Photo' section as per user request
                const effectiveExamType = type === 'MANUAL_CAPTURE_PHOTO' ? 'Photo' : examType;

                const newEvidence = { img: data, time: new Date().toISOString(), type };
                
                const partialResponse = {
                    studentId: student.id,
                    batchId: batch.id,
                    examType: effectiveExamType,
                    evidence: [newEvidence],
                    status: 'draft'
                };

                window.Utils.saveResponse(partialResponse);

                // Update local state (UI)
                setEvidence(prev => [...prev, newEvidence]);

                // v84.9.4: Auto-show gallery on first capture to confirm success
                if (!showGallery) setShowGallery(true);
            };

            const startSegment = () => {
                // Video recording is disabled (v81)
                console.log("Assessor Video Recording is disabled.");
            };

            const toggleRecording = () => {
                alert("Manual video recording is currently disabled (v81).");
            };




            const saveGrades = () => {
                const responses = window.Utils.getResponses();
                let idx = responses.findIndex(r => r.studentId === student.id && r.examType === examType);

                if (idx === -1) {
                    // Create if not exists (e.g. starting fresh manual grade)
                    const newResp = {
                        id: window.Utils.generateId(),
                        studentId: student.id,
                        examType,
                        evidence,
                        answers, // might be empty for manual
                        assessorMarks: grades
                    };
                    responses.push(newResp);
                } else {
                    if (!responses[idx].id) responses[idx].id = window.Utils.generateId(); // backfill
                    responses[idx].assessorMarks = grades;
                    responses[idx].evidence = evidence; // Ensure evidence is synced

                    // Calculate Total
                    const total = Object.values(grades).reduce((a, b) => parseFloat(a || 0) + parseFloat(b || 0), 0);
                    responses[idx].totalScore = total;
                }

                try {
                    localStorage.setItem(DB_KEYS.RESPONSES, JSON.stringify(responses));
                } catch (e) {
                    console.error("Storage Full", e);
                }

                // DIRECT SYNC
                const currentResp = idx === -1 ? responses[responses.length - 1] : responses[idx];
                window.Utils.saveToCloud('responses', currentResp).catch(console.error);

                // alert("Grades Saved Successfully! (Synced)");
            };

            const deleteEvidence = async () => {
                if (!confirm("Move all evidence to RECYCLE BIN? You can restore it later from the Trash folder.")) return;

                const responses = window.Utils.getResponses();
                const idx = responses.findIndex(r => r.studentId === student.id && r.examType === examType);
                if (idx === -1) {
                    alert("No active response found to delete.");
                    return;
                }

                // v85.0: Soft-Delete (Move to Trash)
                const metadata = { 
                    studentId: student.id, 
                    studentName: student.name, 
                    batchName: batch.name, 
                    examType: examType,
                    responseId: responses[idx].id 
                };
                
                // We move each evidence item to trash
                evidence.forEach(ev => window.Utils.trash('evidence', ev, metadata));

                // Clear from current response (locally and sync)
                responses[idx].evidence = [];
                responses[idx].synced = false;
                localStorage.setItem(DB_KEYS.RESPONSES, JSON.stringify(responses));
                window.Utils.uploadToCloud(true, 'responses');

                setEvidence([]); // Update UI
                alert("Evidence moved to Recycle Bin.");
            };

            // v30.7: Bulk Delete Logic
            const toggleSelect = async (e, item) => {
                e.stopPropagation(); // prevent player click
                if (selectedEvidence.some(sel => sel === item)) {
                    setSelectedEvidence(prev => prev.filter(p => p !== item));
                } else {
                    setSelectedEvidence(prev => [...prev, item]);
                }
            };

            const deleteSelectedEvidence = async () => {
                if (!confirm(`Are you sure you want to PERMANENTLY delete ${selectedEvidence.length} items?`)) return;

                const statusBtn = document.getElementById('sync-status-text');
                if (statusBtn) statusBtn.innerText = "Deleting...";

                // Delete sequentially to avoid race conditions
                for (let item of selectedEvidence) {
                    await window.Utils.deleteEvidence(student.id, examType, item);
                }

                // Refresh
                const targetResp = window.Utils.getResponses().find(r => r.studentId === student.id && r.examType === examType);
                if (targetResp) {
                    setEvidence(targetResp.evidence || []);
                } else {
                    setEvidence([]);
                }
                setSelectedEvidence([]);
                if (statusBtn) statusBtn.innerText = "Deleted Selected Items";
            };

            // Helper to download all evidence as a ZIP
            const downloadAllEvidence = async () => {
                if (!evidence || evidence.length === 0) {
                    alert('No evidence photos found to download.');
                    return;
                }
                try {
                    const zip = new JSZip();
                    const folder = zip.folder(`${student.name}_${examType}_Evidence`);
                    let count = 0;

                    const toBase64 = async (src) => {
                        if (!src) return null;
                        if (src.startsWith('data:')) return src.split(',')[1]; // already base64

                        // NEW: Handle S3 Proxy to avoid CORS errors during ZIP creation (v84.9.5)
                        let finalUrl = src;
                        if (finalUrl && finalUrl.includes('amazonaws.com') && !finalUrl.includes('media-stream')) {
                            try {
                                const urlObj = new URL(finalUrl);
                                let s3Key = urlObj.pathname.startsWith('/') ? urlObj.pathname.substring(1) : urlObj.pathname;
                                s3Key = decodeURIComponent(s3Key);
                                finalUrl = `${API_BASE}/media-stream?key=${encodeURIComponent(s3Key)}&apiKey=portel_secure_key_2025`;
                            } catch (e) {
                                console.error("Proxy URL Parse Error in Download", e);
                            }
                        }

                        // blob: URL or https:// URL — fetch it
                        try {
                            const resp = await fetch(finalUrl);
                            const blob = await resp.blob();
                            return await new Promise(res => {
                                const reader = new FileReader();
                                reader.onload = e => res(e.target.result.split(',')[1]);
                                reader.readAsDataURL(blob);
                            });
                        } catch (e) {
                            console.warn('Could not fetch image:', finalUrl, e);
                            return null;
                        }
                    };

                    for (const item of evidence) {
                        let base64Data = null;

                        // Priority: resolved img (blob/data) > downloadUrl > url > IndexedDB key
                        if (item.img && (item.img.startsWith('data:') || item.img.startsWith('blob:'))) {
                            base64Data = await toBase64(item.img);
                        } else if (item.downloadUrl) {
                            base64Data = await toBase64(item.downloadUrl);
                        } else if (item.url) {
                            base64Data = await toBase64(item.url);
                        } else if (item.img && item.storage === 'indexeddb') {
                            // Try to load from IndexedDB directly
                            try {
                                const blob = await window.VideoDB.getVideo(item.img);
                                if (blob) base64Data = await toBase64(URL.createObjectURL(blob));
                            } catch (e) { console.warn('IndexedDB load failed', e); }
                        } else if (item.img) {
                            base64Data = await toBase64(item.img);
                        }

                        if (!base64Data) continue;

                        const typeLabel = (item.type || 'Photo').replace(/[^a-zA-Z0-9_]/g, '_');
                        const fileName = `${String(count + 1).padStart(2, '0')}_${typeLabel}.jpg`;
                        folder.file(fileName, base64Data, { base64: true });
                        count++;
                    }

                    if (count === 0) { alert('No downloadable images found. Images may still be uploading to cloud.'); return; }
                    const blob = await zip.generateAsync({ type: 'blob' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `${student.name}_${examType}_Evidence_${new Date().toISOString().slice(0,10)}.zip`;
                    document.body.appendChild(a); // v85.1: Attach for better browser compatibility
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(a.href);
                    alert(`Downloaded ${count} evidence photo(s) successfully!`);
                } catch (err) {
                    console.error('Download failed', err);
                    alert('Download failed: ' + err.message);
                }
            };

            // Force Camera to be visible ONLY for Assessor (who has captureOnly=true)
            const showCamera = captureOnly;

            return (
                <div>
                    <div className="flex justify-between items-center mb-4">
                        <button onClick={onBack} className="text-indigo-600 font-medium flex items-center gap-1"><Icons.ChevronDown className="rotate-90" /> Back</button>
                        <h3 className="text-xl font-bold">{captureOnly ? 'Capture Evidence: ' : 'Evidence: '}{student.name}</h3>
                        <div className="flex gap-2">

                            <button onClick={() => setShowGallery(!showGallery)} className="bg-gray-200 text-gray-700 px-4 py-2 rounded shadow hover:bg-gray-300 flex items-center gap-2 font-bold">
                                {showGallery ? <Icons.EyeOff className="w-4 h-4" /> : <Icons.Eye className="w-4 h-4" />} {showGallery ? 'Hide Gallery' : 'View Gallery'}
                            </button>
                            <button onClick={downloadAllEvidence} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded shadow flex items-center gap-2 font-bold transition-all hover:scale-105" title="Download all evidence photos as ZIP">
                                <Icons.Download className="w-4 h-4" /> Download Evidence
                            </button>
                            {!captureOnly && (
                                <>
                                    <button onClick={saveGrades} className="bg-indigo-600 text-gray-900 px-4 py-2 rounded shadow hover:bg-indigo-700 flex items-center gap-2 font-bold transition-transform hover:scale-105">
                                        <Icons.Check className="w-4 h-4" /> Save Grades
                                    </button>
                                    <button onClick={deleteEvidence} className="text-red-600 hover:text-red-700 p-2" title="Reset Evidence">
                                        <Icons.Trash2 className="w-5 h-5" />
                                    </button>
                                </>
                            )}
                        </div>
                    </div>

                    {/* v30.7: Verification Details Display (v84.3: Always show if available) */}
                    {verificationInfo ? (
                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6 flex flex-wrap gap-8 items-center shadow-sm">
                            <div>
                                <h4 className="text-xs font-bold text-blue-500 uppercase tracking-wider">Candidate Name</h4>
                                <p className="text-lg font-bold text-gray-800">{student.name}</p>
                            </div>
                            <div>
                                <h4 className="text-xs font-bold text-blue-500 uppercase tracking-wider">Father's Name</h4>
                                <p className="text-lg font-bold text-gray-800">{verificationInfo.fatherName || 'N/A'}</p>
                            </div>
                            <div>
                                <h4 className="text-xs font-bold text-blue-500 uppercase tracking-wider">Aadhar Number</h4>
                                <p className="text-lg font-bold text-gray-800 font-mono tracking-wide">{verificationInfo.aadharNumber || 'N/A'}</p>
                            </div>
                            <div>
                                <h4 className="text-xs font-bold text-blue-500 uppercase tracking-wider">Status</h4>
                                <p className="text-lg font-bold text-green-600 flex items-center gap-1"><Icons.CheckCircle className="w-5 h-5" /> Verified</p>
                            </div>
                        </div>
                    ) : null}

                    {/* Assessor Camera Section - ALWAYS VISIBLE */}
                    <div className="bg-primary-50/50 border border-primary-100 p-8 rounded-[32px] shadow-sm mb-10 text-center relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-primary-500/5 blur-3xl -mr-16 -mt-16"></div>
                        <h4 className="text-sm font-black text-primary-600 uppercase tracking-widest mb-2">Performance Analytics Node</h4>
                        <p className="text-gray-900 font-bold">Real-time data visualization and assessment metrics for all operational units.</p>
                    </div>
                    {showCamera && (
                        <div className="bg-white p-4 rounded shadow mb-6 text-gray-900 text-center border border-gray-100">
                            {!isCamActive ? (
                                <div className="py-8">
                                    <Icons.Camera className="w-16 h-16 mx-auto text-gray-400 mb-4" />
                                    <h4 className="text-xl font-bold mb-2">Ready to Capture</h4>
                                    <p className="text-gray-700 mb-6">Take photos or record videos for {examType} evidence.</p>
                                    <button onClick={startCam} className="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3 rounded-full font-bold shadow-lg transform hover:scale-105 transition-all text-lg">
                                        <Icons.Camera className="w-5 h-5 inline mr-2" /> Start Camera
                                    </button>
                                </div>
                            ) : (
                                <div>
                                    <div className="grid md:grid-cols-2 gap-4">
                                        <div className="relative bg-slate-900 rounded overflow-hidden aspect-video shadow-2xl border border-gray-700">
                                            <video ref={videoRef} autoPlay muted playsInline className="w-full h-full object-cover"></video>
                                            
                                            {/* v84.9.4: Shutter Flash Effect */}
                                            {isFlashing && (
                                                <div className="absolute inset-0 bg-white/80 z-[60] animate-pulse"></div>
                                            )}

                                            {isRecording && (
                                                <div className="absolute top-4 right-4 animate-pulse flex items-center gap-2 bg-red-600/90 backdrop-blur text-white px-3 py-1 rounded-full text-xs font-bold ring-2 ring-red-500/50">
                                                    <span className="w-2 h-2 rounded-full bg-white"></span> RECORDING
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex flex-col justify-center gap-4 px-8">
                                            <button onClick={capturePhoto} className="bg-white text-slate-900 hover:bg-indigo-50 py-4 rounded-xl font-bold flex items-center justify-center gap-3 shadow-xl transition-all hover:-translate-y-1 active:scale-95 border-b-4 border-gray-200">
                                                <Icons.Camera className="w-6 h-6 text-indigo-600" /> Capture Photo
                                            </button>
                                            <button onClick={toggleRecording} className={`py-4 rounded-xl font-bold flex items-center justify-center gap-3 shadow-xl transition-all hover:-translate-y-1 active:scale-95 border-b-4 ${isRecording ? 'bg-red-500 hover:bg-red-600 text-white border-red-700' : 'bg-slate-700 hover:bg-slate-600 text-white border-slate-900'}`}>
                                                {isRecording ? <><Icons.Square className="w-5 h-5" /> Stop Recording</> : <><Icons.Video className="w-6 h-6" /> Start Video Recording</>}
                                            </button>
                                            <button onClick={stopCam} className="mt-4 text-gray-800 hover:text-gray-900 text-sm font-medium w-full">Cancel / Turn Off Camera</button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* v84.9.4: Success Toast Notification */}
                    {lastCaptureToast && (
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[100] animate-bounce">
                            <div className="bg-emerald-600 text-white px-8 py-4 rounded-2xl shadow-2xl font-black text-sm uppercase tracking-widest flex items-center gap-3">
                                <Icons.CheckCircle className="w-6 h-6" /> {lastCaptureToast}
                            </div>
                        </div>
                    )}

                    {/* Evidence Gallery (Categorized) */}
                    {showGallery && (
                        <div className="bg-white rounded shadow animate-fade-in mb-6 border-l-4 border-indigo-500 overflow-hidden">
                            <div className="flex gap-2 mb-4 overflow-x-auto pb-2">
                                {['All', 'Photos', 'Videos', 'Logs'].map(tab => (
                                    <button
                                        key={tab}
                                        onClick={() => setEvidenceFilter(tab)}
                                        className={`px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap transition-colors ${evidenceFilter === tab ? 'bg-indigo-600 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                                    >
                                        {tab}
                                    </button>
                                ))}
                            </div>

                            {(() => {
                                // SMART FILTER (v19.0.27): If Full Video exists, HIDE segments
                                const hasFullVideo = evidence.some(e => e.type === 'VIDEO_FULL_MERGED' || e.isFullVideo);
                                console.log("[UI] Has Full Video?", hasFullVideo);

                                let filtered = evidence.filter(e => {
                                    // 1. Hide segments if full video exists (Clean View)
                                    if (hasFullVideo && (e.type === 'VIDEO_INDEXED_DB' || e.isSegment)) return false;

                                    // 2. Apply tab-specific filters
                                    if (evidenceFilter === 'Photos') {
                                        return (
                                            e.img ||
                                            e.type?.includes('PHOTO') ||
                                            e.type?.includes('IMG') ||
                                            e.type?.includes('SNAPSHOT') ||
                                            e.type?.includes('PERSONS')
                                        );
                                    }
                                    if (evidenceFilter === 'Videos') return e.type?.includes('VIDEO');
                                    if (evidenceFilter === 'Logs') return !e.img && !e.type?.includes('VIDEO');

                                    return true; // 'All'
                                });

                                if (filtered.length === 0) return <p className="text-gray-700 text-sm text-center py-8">No records found for {evidenceFilter}</p>;

                                if (evidenceFilter === 'LOGS') {
                                    return (
                                        <div className="space-y-2">
                                            {filtered.map((e, i) => (
                                                <div key={i} className="flex items-center justify-between p-3 bg-gray-50 rounded border-l-4 border-amber-400">
                                                    <div className="flex items-center gap-3">
                                                        <Icons.TriangleAlert className="w-5 h-5 text-amber-500" />
                                                        <div>
                                                            <p className="font-bold text-sm text-gray-800">{(e.type || 'UNKNOWN').replace(/_/g, ' ')}</p>
                                                            <p className="text-xs text-gray-800">System Flag</p>
                                                        </div>
                                                    </div>
                                                    <span className="text-xs font-mono bg-white px-2 py-1 rounded border">{new Date(e.time).toLocaleString()}</span>
                                                </div>
                                            ))}
                                        </div>
                                    );
                                }

                                // GROUPING LOGIC
                                const grouped = [];
                                const sessions = {};

                                filtered.forEach(e => {
                                    if (e.sessionId) {
                                        if (!sessions[e.sessionId]) {
                                            sessions[e.sessionId] = {
                                                ...e,
                                                isGroup: true,
                                                parts: [],
                                                type: 'VIDEO_SESSION'
                                            };
                                            grouped.push(sessions[e.sessionId]);
                                        }
                                        sessions[e.sessionId].parts.push(e);
                                    } else {
                                        grouped.push(e);
                                    }
                                });

                                // Sort parts
                                Object.values(sessions).forEach(s => s.parts.sort((a, b) => a.sequence - b.sequence));

                                // v30.7: Bulk Logic Helpers
                                const allSelected = grouped.length > 0 && grouped.every(g => {
                                    if (g.isGroup) return g.parts.every(p => selectedEvidence.includes(p));
                                    return selectedEvidence.includes(g);
                                });

                                const handleSelectAll = () => {
                                    if (allSelected) {
                                        setSelectedEvidence([]);
                                    } else {
                                        // Select ALL parts of ALL grouped items
                                        const allItems = [];
                                        grouped.forEach(g => {
                                            if (g.isGroup) allItems.push(...g.parts);
                                            else allItems.push(g);
                                        });
                                        setSelectedEvidence(allItems);
                                    }
                                };

                                return (
                                    <div>
                                        {/* BULK ACTIONS BAR */}
                                        <div className="flex justify-between items-center px-4 py-2 bg-gray-50 border-b mb-4">
                                            <label className="flex items-center gap-2 cursor-pointer font-bold text-gray-700">
                                                <input type="checkbox" checked={allSelected} onChange={handleSelectAll} className="w-5 h-5 accent-indigo-600" />
                                                Select All ({grouped.length} Items)
                                            </label>
                                            {selectedEvidence.length > 0 && (
                                                <button onClick={deleteSelectedEvidence} className="bg-red-600 hover:bg-red-700 text-white px-4 py-1 rounded text-sm font-bold flex items-center gap-2 animate-pulse">
                                                    <Icons.Trash2 className="w-4 h-4" /> Delete ({selectedEvidence.length})
                                                </button>
                                            )}
                                        </div>

                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 px-4 pb-4">
                                            {grouped.map((e, i) => {
                                                // Check selection status
                                                const isSelected = e.isGroup ? e.parts.every(p => selectedEvidence.includes(p)) : selectedEvidence.includes(e);

                                                return (
                                                    <div key={i} className={`relative group bg-gray-100 rounded overflow-hidden border transition-all ${isSelected ? 'ring-4 ring-indigo-500' : ''}`}>

                                                        {/* CHECKBOX OVERLAY */}
                                                        <div className="absolute top-2 left-2 z-20">
                                                            <input
                                                                type="checkbox"
                                                                checked={isSelected}
                                                                onChange={(ev) => {
                                                                    ev.stopPropagation();
                                                                    if (e.isGroup) {
                                                                        // Toggle all parts
                                                                        if (isSelected) setSelectedEvidence(prev => prev.filter(p => !e.parts.includes(p)));
                                                                        else setSelectedEvidence(prev => [...prev, ...e.parts]);
                                                                    } else {
                                                                        toggleSelect(ev, e);
                                                                    }
                                                                }}
                                                                className="w-6 h-6 accent-indigo-600 shadow-sm cursor-pointer"
                                                            />
                                                        </div>

                                                        {e.isGroup ? (
                                                            <SessionPlayer parts={e.parts} onRemove={async (item) => {
                                                                const success = await window.Utils.deleteEvidence(student.id, examType, item);
                                                                if (success) loadStudentResponse(student);
                                                            }} />
                                                        ) : (
                                                            <>
                                                                {e.type.includes('VIDEO') ? (
                                                                    <SessionPlayer parts={[e]} onRemove={async (item) => {
                                                                        const success = await window.Utils.deleteEvidence(student.id, examType, item);
                                                                        if (success) loadStudentResponse(student);
                                                                    }} />
                                                                ) : (
                                                                    <EvidenceImage item={e} onRemove={async (item) => {
                                                                        const success = await window.Utils.deleteEvidence(student.id, examType, item);
                                                                        if (success) loadStudentResponse(student);
                                                                    }} />
                                                                )}
                                                            </>
                                                        )}

                                                        {/* Fallback for Error */}
                                                        <div className="absolute inset-0 hidden flex-col items-center justify-center bg-gray-200 text-gray-800 p-2 text-center">
                                                            <Icons.XCircle className="w-8 h-8 mb-1" />
                                                            <span className="text-[10px] font-bold">Media Not Found</span>
                                                        </div>

                                                        <div className="absolute top-0 right-0 bg-slate-900/60 text-white text-[10px] px-2 py-1 rounded-bl z-10">
                                                            {new Date(e.time).toLocaleTimeString()}
                                                        </div>
                                                        <div className="absolute inset-x-0 bottom-0 bg-white/90 p-2 text-xs font-bold truncate text-center border-t">
                                                            {e.isGroup ? `Exam Recording (${e.parts.length} Parts)` : e.type.replace(/_/g, ' ')}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>
                    )}

                    {
                        !captureOnly && (
                            <div className="bg-white p-6 rounded shadow">
                                {(() => {
                                    const currentQPId = examType === 'Theory' ? batch?.theoryPaperId : (examType === 'Viva' ? batch?.vivaPaperId : batch?.practicalPaperId);
                                    const currentQP = allQPapers.find(q => q.id === currentQPId);

                                    return (
                                        <>
                                            <h4 className="font-bold mb-4 flex items-center justify-between">
                                                <span>Grading: {currentQP?.name || 'Manual Grade'}</span>
                                                <span className="text-sm font-normal text-gray-800 bg-gray-100 px-2 py-1 rounded">QP: {currentQP?.code || 'N/A'}</span>
                                            </h4>
                                            <div className="space-y-4">
                                                {currentQP?.questions?.map((question, index) => {
                                                    const qIdx = String(index);
                                                    const ans = answers[qIdx];
                                                    return (
                                                        <div key={qIdx} className="bg-gray-50 p-4 rounded border flex items-center justify-between">
                                                            <div className="flex-1 pr-4">
                                                                <span className="font-bold text-gray-700 block mb-1">Q{index + 1}: {question?.question}</span>
                                                                {/* Tiny Answer preview */}
                                                                {typeof ans === 'string' && (
                                                                    <div className="mt-1">
                                                                        <p className={`text-xs font-medium truncate max-w-md ${question?.correctAnswer && String(ans).toLowerCase() === String(question.correctAnswer).toLowerCase() ? 'text-green-600' : 'text-gray-600'}`}>
                                                                            Student Answer: {ans}
                                                                        </p>
                                                                        {question?.correctAnswer && (
                                                                            <p className="text-xs text-green-700 font-bold truncate max-w-md">
                                                                                Correct Answer: {question.correctAnswer}
                                                                            </p>
                                                                        )}
                                                                    </div>
                                                                )}
                                                            </div>
                                                            <div className="flex items-center gap-3">
                                                                <div className="flex items-center gap-2 bg-white p-2 rounded border shadow-sm">
                                                                    <span className="text-xs font-bold text-gray-800 uppercase">Score</span>
                                                                    <input type="number"
                                                                        className="w-16 p-1 border-b-2 border-indigo-200 text-center font-bold text-indigo-700 outline-none focus:border-indigo-600"

                const month = date.getMonth();
                const year = date.getFullYear();
                const totalDays = daysInMonth(month, year);
                const startDay = firstDayOfMonth(month, year);
                const days = [];

                // Empty slots for days before start of month
                for (let i = 0; i < startDay; i++) {
                    days.push(<div key={`empty-${i}`} className="h-24 bg-gray-50 border border-gray-100"></div>);
                }

                // Days of month
                for (let d = 1; d <= totalDays; d++) {
                    const currentDay = new Date(year, month, d);
                    const dayEvents = events.filter(e =>
                        e.date.getDate() === d &&
                        e.date.getMonth() === month &&
                        e.date.getFullYear() === year

        const RecycleBinModal = ({ isOpen, onClose }) => {
            const [trashItems, setTrashItems] = useState([]);

            useEffect(() => {
                if (isOpen) {
                    setTrashItems(window.Utils.getTrash());
                    setLoading(false);

            }, [isOpen]);

            const handleRestore = (item) => {
                if (confirm(`Restore this ${item.type || 'item'} to the system?`)) {
                    const trash = window.Utils.getTrash();
                    const updatedTrash = trash.filter(i => i.trashId !== item.trashId);
                    localStorage.setItem('se_trash', JSON.stringify(updatedTrash));

                    // Restore to appropriate store (Currently only evidence is trashed)
                    if (item.type) {
                        const responses = window.Utils.getResponses();
                        const respIndex = responses.findIndex(r => 
                            (item.meta?.responseId && r.id === item.meta.responseId) || 
                            (r.studentId === item.meta?.studentId && r.examType === item.meta?.examType)
                        );
                        if (respIndex >= 0) {
                            if (!responses[respIndex].evidence) responses[respIndex].evidence = [];
                            // Remove trash metadata and re-add to evidence
                            const restored = { ...item };
                            delete restored.trashId;
                            delete restored.deletedAt;
                            delete restored.meta;
                            
                            responses[respIndex].evidence.push(restored);
                            localStorage.setItem('se_responses', JSON.stringify(responses));
                            window.Utils.uploadToCloud(true);
                        }
                    }
                    setTrashItems(updatedTrash);
                    alert("Item restored successfully!");
                }
            };

            const handlePurge = (trashId) => {
                if (confirm("Permanently delete this item? This action cannot be undone.")) {
                    const trash = window.Utils.getTrash();
                    const updated = trash.filter(i => i.trashId !== trashId);
                    localStorage.setItem('se_trash', JSON.stringify(updated));
                    setTrashItems(updated);
                }
            };

            const handleClearTrash = () => {
                if (confirm("Are you sure you want to empty the Recycle Bin? All items will be permanently deleted.")) {
                    window.Utils.clearTrash();
                    setTrashItems([]);
                    onClose();
                }

                        setOutput("Error: " + (data.message || "Unknown API Error"));

                                ctx.drawImage(srcVid, 0, 0, canvas.width, canvas.height);

                                // Draw Timestamp
                                const now = new Date();
                                const timeStr = now.toLocaleString('en-US', {
                                    weekday: 'short', year: 'numeric', month: 'short', day: 'numeric',
                                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                                });

                                ctx.font = "bold 24px monospace";
                                ctx.fillStyle = "white";
                                ctx.strokeStyle = "black";
                                ctx.lineWidth = 3;
                                ctx.strokeText(timeStr, 20, 40);
                                ctx.fillText(timeStr, 20, 40);
                            }
                            compositeReqRef.current = requestAnimationFrame(draw);
                        };

                        srcVid.oncanplay = () => {
                            console.log("Theory Cam Ready. Starting Canvas Stream.");
                            srcVid.play();
                            draw();

                            // Create Canvas Stream
                            const finalStream = canvas.captureStream(30);
                            // Add Audio Tracks from Mic
                            rawStream.getAudioTracks().forEach(t => finalStream.addTrack(t));

                            const video = videoRef.current;
                            if (video) video.srcObject = finalStream;
                            setMediaStream(finalStream); // Trigger recorder only when data is flowing
                            setStreamActive(true); // AUTO-START UI: Hide 'Start Camera' button
                        };
                    }).catch(e => {
                        console.error("Camera Error", e);
                        alert("Camera/Audio Access Denied! Please allow access to proceed.");
                    });
                }
                return () => {
                    if (compositeReqRef.current) cancelAnimationFrame(compositeReqRef.current);
                };
            }, [webcamActive, examMode, mediaStream]);

            // Security: Block Right Click, Copy, Paste
            useEffect(() => {
                if (!examMode || isLocked) return;

                const preventDefault = (e) => {
                    e.preventDefault();
                    // Optional: logViolation("Action Blocked"); // Can be too noisy
                };

                const blockCopyPaste = (e) => {
                    e.preventDefault();
                    // logViolation("Copy/Paste Attempted");
                    alert("Copy/Paste is disabled during the exam!");
                };

                document.addEventListener('contextmenu', preventDefault);
                document.addEventListener('copy', blockCopyPaste);
                document.addEventListener('cut', blockCopyPaste);
                document.addEventListener('paste', blockCopyPaste);
                document.addEventListener('selectstart', preventDefault); // Block Selection

                return () => {
                    document.removeEventListener('contextmenu', preventDefault);
                    document.removeEventListener('copy', blockCopyPaste);
                    document.removeEventListener('cut', blockCopyPaste);
                    document.removeEventListener('paste', blockCopyPaste);
                    document.removeEventListener('selectstart', preventDefault);
                };
            }, [examMode, isLocked]);

            useEffect(() => {
                if (examMode === 'VivaLive') {
                    navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                        camStreamRef.current = stream; // Reference for cleanup
                        const v = document.getElementById('student-cam-viva');
                        if (v) v.srcObject = stream;
                    });
                }
            }, [examMode]);
            useEffect(() => {
                if (!examMode || isLocked) return;

                // DISABLE PROCTORING FOR VIVA (To allow 2-tab simulation)
                if (examMode === 'VivaWait' || examMode === 'VivaLive') return;

                const handleVisibility = () => {
                    if (document.hidden) {
                        logViolation("Tab Switch / Minimized Browser");
                    }
                };

                document.addEventListener('visibilitychange', handleVisibility);
                return () => document.removeEventListener('visibilitychange', handleVisibility);
            }, [examMode, isLocked, warnings]);

            // Object Detection Loop
            useEffect(() => {
                if (!examMode || !webcamActive || isLocked || !proctoringModel) {
                    if (detectionInterval.current) clearInterval(detectionInterval.current);
                    return;
                }

                let tick = 0;
                detectionInterval.current = setInterval(async () => {
                    tick++;
                    const video = videoRef.current;
                    if (video && video.readyState >= 2) {
                        const predictions = await proctoringModel.detect(video);

                        // Check for Mobile Phone
                        const hasPhone = predictions.some(p => p.class === 'cell phone' || p.class === 'remote'); // cell phone usually
                        if (hasPhone) {
                            logViolation("Mobile Device Detected");
                            // Capture Violation Evidence
                            const c = document.createElement('canvas'); c.width = 300; c.height = 200;
                            c.getContext('2d').drawImage(video, 0, 0, 300, 200);
                            window.Utils.saveResponse({
                                studentId: user.id, examType: examMode,
                                evidence: [{ img: c.toDataURL(), time: new Date().toISOString(), type: 'VIOLATION_PHONE' }]
                            });
                        }

                        // Check for Person Count
                        const personCount = predictions.filter(p => p.class === 'person').length;
                        if (personCount > 1) {
                            logViolation("Multiple Persons Detected");
                            // Capture Violation Evidence
                            const c = document.createElement('canvas'); c.width = 300; c.height = 200;
                            c.getContext('2d').drawImage(video, 0, 0, 300, 200);
                            window.Utils.saveResponse({
                                studentId: user.id, examType: examMode,
                                evidence: [{ img: c.toDataURL(), time: new Date().toISOString(), type: 'VIOLATION_MULTIPLE_PERSONS' }]
                            });
                        }

                        // PERIODIC SNAPSHOT REMOVED (Moved to independent loop)
                    }
                }, 3000); // Check every 3 seconds

                return () => clearInterval(detectionInterval.current);
            }, [examMode, webcamActive, isLocked, proctoringModel, warnings]);

            useEffect(() => {
                let interval;
                if (examMode && timeLeft > 0 && !isSubmitting) interval = setInterval(() => setTimeLeft(t => t - 1), 1000);
                return () => clearInterval(interval);
            }, [examMode, timeLeft, isSubmitting]);

            const startExam = async (mode) => {
                // v26: Intercept for Verification
                if (mode !== 'VERIFIED_START') {
                    console.log("[Verification] Intercepting Exam Start:", mode);
                    setPendingExamMode(mode);
                    setVerificationStep('SELFIE'); // v30.7: Reordered: Photo First
                    return;
                }
                console.log("[Verification] Starting Verified Exam");

                const startMode = pendingExamMode || mode; // Fallback

                let batch = window.Utils.getBatches().find(b => String(b.id || '').trim() === String(user.batchId || '').trim());

                // AUTO-HEAL: If batch not found locally, try one-time sync before erroring
                if (!batch && user.batchId) {
                    console.log(`[Auto-Heal] Batch ${user.batchId} missing locally. Syncing...`);
                    const statusText = document.getElementById('sync-status-text');
                    if (statusText) statusText.innerText = "Checking Cloud for Batch...";

                    try {
                        // Force a non-destructive download
                        const ok = await window.Utils.downloadFromCloud(true);
                        batch = window.Utils.getBatches().find(b => String(b.id || '').trim() === String(user.batchId || '').trim());
                        if (statusText) statusText.innerText = batch ? "Batch Found!" : "Sync Complete";
                    } catch (e) {
                        console.error("Auto-heal batch sync failed", e);
                    }
                }

                // v19.0.10: Enhanced Diagnostic Logger
                console.log("[Diagnostic] Current Batch Lookup:", {
                    assignedId: user.batchId,
                    assignedIdTrimmed: String(user.batchId || '').trim(),
                    foundLocally: !!batch,
                    localBatchCount: window.Utils.getBatches().length,
                    localIds: window.Utils.getBatches().map(b => b.id)
                });

                if (!batch) {
                    const errorMsg = `Exam Error: Your assigned Batch (ID: ${user.batchId || 'NONE'}) was not found locally even after sync.\n\n` +
                        `1. Ensure you have an internet connection.\n` +
                        `2. Ask Admin to ensure the Batch is "Synced" to Cloud.\n` +
                        `3. Click OK to try Syncing one more time.`;

                    if (confirm(errorMsg)) {
                        await window.Utils.downloadFromCloud(false); // Manual sync if they confirm
                    }
                    return;
                }

                // Helper to parse potential DD-MM-YYYY, DD/MM/YYYY or YYYY-MM-DD
                const parseDateTime = (dateStr, timeStr) => {
                    if (!dateStr || !timeStr) return null;
                    // Remove ISO T part if accidentally included
                    const pureDate = dateStr.split('T')[0];

                    // Try direct parse (works for YYYY-MM-DD)
                    let d = new Date(`${pureDate}T${timeStr}`);

                    if (isNaN(d.getTime())) {
                        // Handle DD-MM-YYYY or DD/MM/YYYY
                        const sep = pureDate.includes('-') ? '-' : (pureDate.includes('/') ? '/' : null);
                        if (sep) {
                            const parts = pureDate.split(sep);
                            if (parts.length === 3) {
                                // If first part is 4 digits, assume YYYY-MM-DD (already tried but for safety)
                                if (parts[0].length === 4) d = new Date(`${parts[0]}-${parts[1]}-${parts[2]}T${timeStr}`);
                                else d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}T${timeStr}`);
                            }
                        }
                    }
                    return d;
                };

                const checkExpiry = (b) => {
                    if (!b.startDate || !b.startTime || !b.endDate || !b.endTime) return 'OK';
                    const now = new Date();
                    const start = parseDateTime(b.startDate, b.startTime);
                    const end = parseDateTime(b.endDate, b.endTime);
                    if (!start || !end) return 'ERROR';
                    if (now < start) return { status: 'FUTURE', time: start };
                    if (now > end) return { status: 'EXPIRED', time: end };
                    return 'OK';
                };

                let status = checkExpiry(batch);

                // AUTO-HEAL: If expired, try syncing once in case it's stale data
                if (status && status.status === 'EXPIRED') {
                    const btn = document.getElementById('sync-status-text');
                    if (btn) btn.innerText = "Verifying Date...";

                    try {
                        await window.Utils.downloadFromCloud(true);
                        // Re-fetch batch
                        batch = window.Utils.getBatches().find(b => b.id === user.batchId);
                        status = checkExpiry(batch);

                        console.log(`Auto-Sync Completed.\nNew End Date: ${batch.endDate} ${batch.endTime}\nStatus: ${status === 'OK' ? 'Active' : status.status}`);

                    } catch (e) {
                        console.error("Auto-heal sync failed", e);
                        // alert(`Auto-Sync Failed: ${e.message}\nPlease check internet connection.`);
                    }
                }

                if (status === 'ERROR') {
                    alert("Date Error: Invalid Date Format in Batch settings.");
                    return;
                }
                if (status && status.status === 'FUTURE') {
                    alert(`Exam has not started yet.\nStart Time: ${status.time.toLocaleString()}`);
                    return;
                }
                if (status && status.status === 'EXPIRED') {
                    alert(`Exam has expired.\nEnd Time: ${status.time.toLocaleString()}`);
                    return;
                }

                const pid = startMode === 'Theory' ? batch.theoryPaperId : (startMode === 'Viva' ? batch.vivaPaperId : batch.practicalPaperId);
                console.log(`Starting ${startMode}: Batch=${batch.name}, AssignedID=${pid}, AvailableQPs=${window.Utils.getQuestionPapers().length}`);

                if (!pid) {
                    alert(`No ${startMode} question paper has been assigned to this batch.\n\nPlease contact your administrator to assign a ${startMode} paper.`);
                    return;
                }

                let qp = window.Utils.getQuestionPapers().find(q => String(q.id) === String(pid));

                // AUTO-HEAL 2: QP Missing? Try Syncing.
                if (!qp) {
                    console.warn(`[Auto-Heal] QP ${pid} not found locally. Keys:`, window.Utils.getQuestionPapers().map(q => q.id));
                    const btn = document.getElementById('sync-status-text');
                    if (btn) btn.innerText = "Fetching Exam Paper...";
                    try {
                        const syncResult = await window.Utils.downloadFromCloud(true);
                        console.log(`[Auto-Heal] Sync Result: ${syncResult}`);
                        qp = window.Utils.getQuestionPapers().find(q => String(q.id) === String(pid));
                        console.log(`[Auto-Heal] Post-Sync Search for ${pid}:`, qp ? "FOUND" : "NOT FOUND");
                    } catch (e) {
                        console.error("Auto-heal QP sync failed", e);
                    }
                }

                // v84.3: Recovery Logic for Empty Papers
                if (!qp || !qp.questions || qp.questions.length === 0) {
                    if (confirm("Paper found but contains zero questions. This usually means the sync from the Admin device is incomplete.\n\nAttempt a DEEP Cloud Sync now?")) {
                        setIsLoading(true);
                        try {
                            const btn = document.getElementById('sync-status-text');
                            if (btn) btn.innerText = "Deep Syncing...";
                            // Force download everything ignoring local cache
                            await window.Utils.downloadFromCloud(true);
                            const refreshedQP = window.Utils.getQuestionPapers().find(q => String(q.id) === String(pid));
                            
                            if (refreshedQP && refreshedQP.questions && refreshedQP.questions.length > 0) {
                                qp = refreshedQP;
                                alert("Success! Question data recovered from Cloud.");
                                window.location.reload(); 
                                return;
                            } else {
                                alert("DEEP SYNC FAILED: The server also reports zero questions for this paper. Please contact Admin to re-upload the paper using the 'Force Cloud Override' button in the Question Papers tab.");
                            }
                        } catch (err) {
                            alert("Recovery Failed: " + err.message + "\nPlease contact Admin to re-upload the paper.");
                            setIsLoading(false);
                            return;
                        } finally {
                            setIsLoading(false);
                        }
                    } else {
                        return;
                    }
                }

                if (qp) {
                    // v30.7: Explicit Recording Start logic for BOTH modes
                    // v84.2: Final Cleanup for Student Initialization
                    setQuestions(qp.questions || []);
                    setTimeLeft((qp.duration || 60) * 60);

                    if (batch) {
                        setCaptureImage(batch.captureImage !== false);
                        setCameraInterval(batch.cameraInterval || '60');
                    }
                    setExamMode(startMode);
                    setPendingExamMode(null);
                    setVerificationStep(null);
                    setWebcamActive(true);
                    startTimeRef.current = Date.now();

                    if (startMode === 'Practical') {
                        // PRACTICAL: Webcam only (no screen share needed - student uses camera to demonstrate tasks)
                        console.log("Starting Practical Recording (Webcam only)...");
                        await startCameraManual();
                        setTimeout(() => { if (!isRecording) toggleRecording(); }, 2000);
                    } else {
                        // THEORY (Webcam Only)
                        console.log("Starting Theory Recording...");
                        await startCameraManual();
                        setTimeout(() => { if (!isRecording) toggleRecording(); }, 2000);
                    }
                } else {
                    alert("Unavailable: Question Paper not loaded for this batch.");
                }
            };



            const endExam = () => {
                // STOP ALL MEDIA TRACKS
                [mediaStream, camStreamRef.current, screenStreamRef.current].forEach(s => {
                    if (s) {
                        s.getTracks().forEach(track => {
                            track.stop();
                            console.log(`[EndExam] Stopped track: ${track.kind}`);
                        });
                    }
                });

                if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                    mediaRecorderRef.current.stop();
                }
                if (compositeReqRef.current) {
                    cancelAnimationFrame(compositeReqRef.current);
                    compositeReqRef.current = null;
                }
                // RESET STATE
                setMediaStream(null);
                camStreamRef.current = null;
                screenStreamRef.current = null;
                setWebcamActive(false);
                setStreamActive(false);
                setExamMode(null);
                setIsSubmitting(false);
            };

            const submitExam = async () => {
                if (isSubmitting) return;
                setIsSubmitting(true);

                try {
                    // 1. Capture final submission photo (Safe Mode) - MUST BE BEFORE RELEASING TRACKS
                    let finalPhoto = null;
                    try {
                        const v = videoRef.current;
                        if (v && v.readyState === 4) {
                            const c = document.createElement('canvas'); c.width = 320; c.height = 240;
                            c.getContext('2d').drawImage(v, 0, 0, 320, 240);
                            finalPhoto = { img: c.toDataURL(), time: new Date().toISOString(), type: 'SUBMISSION_PHOTO' };
                            console.log("[Submit] Final photo captured");
                        }
                    } catch (e) { console.error("Final Photo Failed", e); }

                    // v76: STOP RECORDING EXPLICITLY & WAIT for final segment to save to VideoDB
                    // (Disabled - v29: Video recording feature removed)
                    if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                        console.log("[Submit] Stopping recorder (Video save disabled)...");
                        mediaRecorderRef.current.stop();
                        setIsRecording(false);
                        if (window.studentRecordingInterval) clearInterval(window.studentRecordingInterval);
                    }

                    // Release ALL camera/screen streams
                    [mediaStream, camStreamRef.current, screenStreamRef.current].forEach(s => {
                        if (s) {
                            s.getTracks().forEach(track => {
                                track.stop();
                                console.log(`[Submit] Stopped track: ${track.kind}`);
                            });
                        }
                    });
                    setMediaStream(null);
                    camStreamRef.current = null;
                    screenStreamRef.current = null;

                    // 2. NOW FETCH EVIDENCE (Will include the last segment and potentially the photo)
                    const currentResponses = window.Utils.getResponses();
                    const existingResp = currentResponses.find(r => r.studentId === user.id && r.examType === examMode);
                    const finalEvidence = existingResp ? [...(existingResp.evidence || [])] : [];
                    if (finalPhoto) finalEvidence.push(finalPhoto);

                    // 3. Calculate Auto-Grades
                    const autoGrades = {};
                    questions.forEach((q, idx) => {
                        if (q.questionType !== 'CODING' && q.questionType !== 'PRACTICAL' && q.questionType !== 'VIVA') {
                            const studentAns = String(answers[idx] || '').trim().toLowerCase();
                            const correctAns = String(q.correctAnswer || '').trim().toLowerCase();
                            if (studentAns && studentAns === correctAns) autoGrades[idx] = q.totalMarks;
                            else autoGrades[idx] = 0;
                        } else autoGrades[idx] = 0;
                    });

                    // 4. Construct Final Response
                    const durationSec = startTimeRef.current ? Math.floor((Date.now() - startTimeRef.current) / 1000) : 0;
                    const respObj = {
                        studentId: user.id,
                        examType: examMode,
                        answers,
                        assessorMarks: autoGrades,
                        evidence: finalEvidence,
                        durationSec: durationSec,
                        submittedAt: new Date().toISOString()
                    };

                    // 5. Save and Sync
                    await window.Utils.saveResponse(respObj);

                    // Give extra moment before sync to ensure everything is flushed
                    await new Promise(r => setTimeout(r, 1000));

                    // Scoped upload (Critical for reliability)
                    const filterByStudent = (item) => String(item.studentId || '').trim() === String(user.id || '').trim();
                    await window.Utils.uploadToCloud(false, 'responses', filterByStudent);

                    const totalPhotos = finalEvidence.filter(e => e.type && (e.type.includes('PHOTO') || e.type.includes('MANUAL') || e.type.includes('SNAPSHOT'))).length;

                    // v84.3: END EXAM BEFORE ALERT (Ensures camera light turns off immediately)
                    endExam();

                    alert(`Exam Submitted Successfully!\n\nSummary: \n - Duration: ${durationSec}s\n - Evidence Items: ${finalEvidence.length}\n - Photos: ${totalPhotos}`);

                } catch (e) {
                    console.error("Submit Failed", e);
                    alert("Submission error: " + e.message + ". Data saved locally.");
                    endExam();
                }
            };


            if (examMode) {
                if (isLocked) return (
                    <div className="flex h-screen fixed inset-0 z-50 bg-red-50 flex-col items-center justify-center text-center p-8 box-border">
                        <Icons.Lock className="w-24 h-24 text-red-600 mb-6" />
                        <h1 className="text-4xl font-bold text-red-700 mb-4">Exam Locked</h1>
                        <p className="text-xl text-gray-700 mb-8">You have exceeded the maximum number of warnings (5/5).<br />Please contact your Assessor to unlock your exam.</p>
                        <div className="bg-white p-6 rounded shadow max-w-md w-full text-left">
                            <h3 className="font-bold mb-2">Violation Log:</h3>
                            <ul className="text-sm text-red-600 list-disc pl-5 max-h-48 overflow-y-auto">
                                {proctoringLogs.map((l, i) => <li key={i}>{l}</li>)}
                            </ul>
                        </div>
                    </div>
                );

                if (examMode === 'VivaWait') return (
                    <div className="flex h-screen fixed inset-0 z-50 bg-white flex-col items-center justify-center text-center p-8 box-border text-gray-900 animate-fade-in overflow-hidden">
                        {/* Decorative Background */}
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full opacity-10 pointer-events-none">
                            <div className="absolute top-0 left-0 w-96 h-96 bg-primary-500 rounded-full blur-[120px] animate-float"></div>
                            <div className="absolute bottom-0 right-0 w-96 h-96 bg-indigo-500 rounded-full blur-[120px] animate-float" style={{ animationDelay: '-3s' }}></div>
                        </div>

                        <div className="relative z-10 max-w-lg w-full">
                            <div className="w-36 h-36 bg-primary-50 rounded-4xl flex items-center justify-center mx-auto mb-10 border-2 border-primary-100 shadow-[0_20px_40px_rgba(139,92,246,0.15)] animate-pulse relative">
                                <Icons.Video className="w-16 h-16 text-primary-600" />
                                <div className="absolute -top-2 -right-2 w-6 h-6 bg-rose-500 rounded-full border-4 border-white animate-ping"></div>
                            </div>

                            <h1 className="text-5xl font-extrabold mb-4 tracking-tighter text-gray-900">Live Lobby</h1>
                            <p className="text-xl text-gray-600 mb-10 font-medium">Please wait. The assessor will admit you to the assessment room shortly.</p>

                            <div className="glass p-4 rounded-2xl mb-12 flex items-center justify-between border border-gray-200 shadow-sm">
                                <div className="flex items-center gap-3">
                                    <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                                    <span className="text-xs font-bold text-gray-600 uppercase tracking-widest">Connection Stable</span>
                                </div>
                                <div className="px-3 py-1 bg-gray-50 border border-gray-100 rounded-lg font-mono text-[10px] text-gray-900">
                                    ROOM: {user.batchId?.slice(-6)}_{user.id?.slice(-4)}
                                </div>
                            </div>

                            <div className="flex flex-col gap-4">
                                <button onClick={() => setExamMode('VivaLive')} className="w-full bg-primary-600 hover:bg-primary-700 text-gray-900 py-4 rounded-2xl font-bold text-lg shadow-xl shadow-primary-900/40 transition-all active:scale-95 flex items-center justify-center gap-2">
                                    <Icons.ArrowRightCircle className="w-6 h-6" /> Join Now (Force)
                                </button>
                                <button onClick={endExam} className="w-full text-secondary-700 hover:text-gray-900 py-2 transition-colors font-bold text-sm">
                                    Leave Waiting Room
                                </button>
                            </div>
                        </div>
                    </div>
                );

                if (examMode === 'VivaLive') return (
                    <div className="flex h-screen fixed inset-0 z-50 bg-gray-100 flex-col animate-fade-in text-gray-900 selection:bg-primary-500/30">
                        <div className="flex-1 relative flex flex-col md:flex-row p-4 gap-4 overflow-hidden">
                            {/* Main Remote View */}
                            <div className="flex-[3] relative bg-white rounded-3xl overflow-hidden shadow-2xl border border-gray-200 group">
                                {remoteStream ? (
                                    <video
                                        id="remote-assessor-video"
                                        ref={ref => { if (ref && remoteStream) ref.srcObject = remoteStream }}
                                        autoPlay
                                        className="w-full h-full object-cover"
                                    />
                                ) : (
                                    <div className="absolute inset-0 flex items-center justify-center bg-gray-50">
                                        <div className="text-center animate-pulse">
                                            <div className="w-24 h-24 mx-auto mb-6 rounded-3xl bg-gray-100 flex items-center justify-center border border-gray-200">
                                                <Icons.User className="w-12 h-12 text-gray-400" />
                                            </div>
                                            <h2 className="text-2xl font-bold text-gray-900">Waiting for Assessor...</h2>
                                            <p className="text-sm text-gray-500 mt-2">Connecting to encrypted video stream</p>
                                        </div>
                                    </div>
                                )}

                                {/* Labels */}
                                <div className="absolute top-6 left-6 flex items-center gap-3">
                                    <div className="px-4 py-2 glass rounded-xl border border-white/60 text-xs font-bold tracking-wider flex items-center gap-2">
                                        <div className="w-1.5 h-1.5 rounded-full bg-primary-500 animate-pulse"></div>
                                        ASSESSOR (HOST)

                                <div className="aspect-video bg-slate-900 rounded-3xl overflow-hidden border-2 border-primary-500/50 shadow-2xl relative group">
                                    <video id="student-cam-viva" autoPlay muted className="w-full h-full object-cover transform scale-x-[-1]" />
                                    <div className="absolute bottom-4 left-4">
                                        <div className="px-3 py-1 glass rounded-lg text-[10px] font-black tracking-widest border border-white/40">
                                            LOCAL (YOU)
                                        </div>
                                    </div>
                                </div>

                                {/* Participant Details / Info */}
                                <div className="flex-1 glass rounded-3xl p-6 border border-gray-200 flex flex-col shadow-sm">
                                    <div className="flex items-center justify-between mb-6 border-b border-gray-100 pb-4">
                                        <h3 className="font-bold text-sm tracking-widest text-gray-900 uppercase">Assessment Meta</h3>
