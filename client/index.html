                // Helper to parse potential DD-MM-YYYY, DD/MM/YYYY or YYYY-MM-DD
                const parseDateTime = (dateStr, timeStr) => {
                    if (!dateStr || !timeStr) return null;
                    // Remove ISO T part if accidentally included
                    const pureDate = dateStr.split('T')[0];

                    // Try direct parse (works for YYYY-MM-DD)
                    let d = new Date(`${pureDate}T${timeStr}`);

                    if (isNaN(d.getTime())) {
                        // Handle DD-MM-YYYY or DD/MM/YYYY
                        const sep = pureDate.includes('-') ? '-' : (pureDate.includes('/') ? '/' : null);
                        if (sep) {
                            const parts = pureDate.split(sep);
                            if (parts.length === 3) {
                                // If first part is 4 digits, assume YYYY-MM-DD (already tried but for safety)
                                if (parts[0].length === 4) d = new Date(`${parts[0]}-${parts[1]}-${parts[2]}T${timeStr}`);
                                else d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}T${timeStr}`);
                            }
                        }
                    }
                    return d;
                };

                const checkExpiry = (b) => {
                    if (!b.startDate || !b.startTime || !b.endDate || !b.endTime) return 'OK';
                    const now = new Date();
                    const start = parseDateTime(b.startDate, b.startTime);
                    const end = parseDateTime(b.endDate, b.endTime);
                    if (!start || !end) return 'ERROR';
                    if (now < start) return { status: 'FUTURE', time: start };
                    if (now > end) return { status: 'EXPIRED', time: end };
                    return 'OK';
                };

                let status = checkExpiry(batch);

                // AUTO-HEAL: If expired, try syncing once in case it's stale data
                if (status && status.status === 'EXPIRED') {
                    const btn = document.getElementById('sync-status-text');

                        console.error("Auto-heal sync failed", e);

                    alert("Date Error: Invalid Date Format in Batch settings.");
                    return;
                }
                if (status && status.status === 'FUTURE') {
                    alert(`Exam has not started yet.\nStart Time: ${status.time.toLocaleString()}`);
                    return;
                }
                if (status && status.status === 'EXPIRED') {
                    alert(`Exam has expired.\nEnd Time: ${status.time.toLocaleString()}`);
                    return;
                }

                const pid = startMode === 'Theory' ? batch.theoryPaperId : (startMode === 'Viva' ? batch.vivaPaperId : batch.practicalPaperId);
                console.log(`Starting ${startMode}: Batch=${batch.name}, AssignedID=${pid}, AvailableQPs=${window.Utils.getQuestionPapers().length}`);

                if (!pid) {
                    alert(`No ${startMode} question paper has been assigned to this batch.\n\nPlease contact your administrator to assign a ${startMode} paper.`);
                    return;
                }

                let qp = window.Utils.getQuestionPapers().find(q => String(q.id) === String(pid));

                // AUTO-HEAL 2: QP Missing? Try Syncing.
                if (!qp) {
                    console.warn(`[Auto-Heal] QP ${pid} not found locally. Keys:`, window.Utils.getQuestionPapers().map(q => q.id));
                    const btn = document.getElementById('sync-status-text');
                    if (btn) btn.innerText = "Fetching Exam Paper...";
                    try {
                        const syncResult = await window.Utils.downloadFromCloud(true);
                        console.log(`[Auto-Heal] Sync Result: ${syncResult}`);
                        qp = window.Utils.getQuestionPapers().find(q => String(q.id) === String(pid));
                        console.log(`[Auto-Heal] Post-Sync Search for ${pid}:`, qp ? "FOUND" : "NOT FOUND");
                    } catch (e) {
                        console.error("Auto-heal QP sync failed", e);
                    }
                }

                // v86.3: Recovery Logic for Empty Papers
                if (!qp || !qp.questions || qp.questions.length === 0) {
                    if (confirm("Paper found but contains zero questions. This usually means the sync from the Admin device is incomplete.\n\nAttempt a DEEP Cloud Sync now?")) {
                        setIsLoading(true);
                        try {
                            const btn = document.getElementById('sync-status-text');
                            if (btn) btn.innerText = "Deep Syncing...";
                            // Force download everything ignoring local cache
                            await window.Utils.downloadFromCloud(true);
                            const refreshedQP = window.Utils.getQuestionPapers().find(q => String(q.id) === String(pid));

                            if (refreshedQP && refreshedQP.questions && refreshedQP.questions.length > 0) {
                                qp = refreshedQP;
                                alert("Success! Question data recovered from Cloud.");
                                window.location.reload();
                                return;
                            } else {
                                alert("DEEP SYNC FAILED: The server also reports zero questions for this paper. Please contact Admin to re-upload the paper using the 'Force Cloud Override' button in the Question Papers tab.");
                            }
                        } catch (err) {
                            alert("Recovery Failed: " + err.message + "\nPlease contact Admin to re-upload the paper.");
                            setIsLoading(false);
                            return;
                        } finally {
                            setIsLoading(false);
                        }
                    } else {
                        return;
                    }
                }

                if (qp) {
                    // v30.7: Explicit Recording Start logic for BOTH modes
                    // v86.2: Final Cleanup for Student Initialization
                    setQuestions(qp.questions || []);
                    setTimeLeft((qp.duration || 60) * 60);

                    if (batch) {
                        setCaptureImage(batch.captureImage !== false);
                        setCameraInterval(batch.cameraInterval || '60');
                    }
                    setExamMode(startMode);
                    setPendingExamMode(null);
                    setVerificationStep(null);
                    setWebcamActive(true);
                    startTimeRef.current = Date.now();

                    if (startMode === 'Practical') {
                        // PRACTICAL: Webcam only (no screen share needed - student uses camera to demonstrate tasks)
                        console.log("Starting Practical Recording (Webcam only)...");
                        await startCameraManual();
                        setTimeout(() => { if (!isRecording) toggleRecording(); }, 2000);
                    } else {
                        // THEORY (Webcam Only)
                        console.log("Starting Theory Recording...");
                        await startCameraManual();
                        setTimeout(() => { if (!isRecording) toggleRecording(); }, 2000);
                    }
                } else {
                    alert("Unavailable: Question Paper not loaded for this batch.");
                }
            };



            const endExam = () => {
                // STOP ALL MEDIA TRACKS
                [mediaStream, camStreamRef.current, screenStreamRef.current].forEach(s => {
                    if (s) {
                        s.getTracks().forEach(track => {
                            track.stop();
                            console.log(`[EndExam] Stopped track: ${track.kind}`);
                        });
                    }
                });

                if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                    mediaRecorderRef.current.stop();
                }
                if (compositeReqRef.current) {
                    cancelAnimationFrame(compositeReqRef.current);
                    compositeReqRef.current = null;
                }
                // RESET STATE
                setMediaStream(null);
                camStreamRef.current = null;
                screenStreamRef.current = null;
                setWebcamActive(false);
                setStreamActive(false);
                setExamMode(null);
                setIsSubmitting(false);
            };

            const submitExam = async () => {
                if (isSubmitting) return;
                setIsSubmitting(true);

                try {
                    // 1. Capture final submission photo (Safe Mode) - MUST BE BEFORE RELEASING TRACKS
                    let finalPhoto = null;
                    try {
                        const v = videoRef.current;
                        if (v && v.readyState === 4) {
                            const c = document.createElement('canvas'); c.width = 320; c.height = 240;
                            c.getContext('2d').drawImage(v, 0, 0, 320, 240);
                            finalPhoto = { img: c.toDataURL(), time: new Date().toISOString(), type: 'SUBMISSION_PHOTO' };
                            console.log("[Submit] Final photo captured");
                        }
                    } catch (e) { console.error("Final Photo Failed", e); }

                    // v76: STOP RECORDING EXPLICITLY & WAIT for final segment to save to VideoDB
                    // (Disabled - v29: Video recording feature removed)
                    if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                        console.log("[Submit] Stopping recorder (Video save disabled)...");
                        mediaRecorderRef.current.stop();
                        setIsRecording(false);
                        if (window.studentRecordingInterval) clearInterval(window.studentRecordingInterval);
                    }

                    // Release ALL camera/screen streams
                    [mediaStream, camStreamRef.current, screenStreamRef.current].forEach(s => {
                        if (s) {
                            s.getTracks().forEach(track => {
                                track.stop();
                                console.log(`[Submit] Stopped track: ${track.kind}`);
                            });
                        }
                    });
                    setMediaStream(null);
                    camStreamRef.current = null;
                    screenStreamRef.current = null;

                    // 2. NOW FETCH EVIDENCE (Will include the last segment and potentially the photo)
                    const currentResponses = window.Utils.getResponses();
                    const existingResp = currentResponses.find(r => r.studentId === user.id && r.examType === examMode);
                    const finalEvidence = existingResp ? [...(existingResp.evidence || [])] : [];
                    if (finalPhoto) finalEvidence.push(finalPhoto);

                    // 3. Calculate Auto-Grades
                    const autoGrades = {};
                    questions.forEach((q, idx) => {
                        if (q.questionType !== 'CODING' && q.questionType !== 'PRACTICAL' && q.questionType !== 'VIVA') {
                            const studentAns = String(answers[idx] || '').trim().toLowerCase();
                            const correctAns = String(q.correctAnswer || '').trim().toLowerCase();
                            if (studentAns && studentAns === correctAns) autoGrades[idx] = q.totalMarks;
                            else autoGrades[idx] = 0;
                        } else autoGrades[idx] = 0;
                    });

                    // 4. Construct Final Response
                    const durationSec = startTimeRef.current ? Math.floor((Date.now() - startTimeRef.current) / 1000) : 0;
                    const totalScore = Object.values(autoGrades).reduce((acc, marks) => acc + (parseFloat(marks) || 0), 0);

                    const respObj = {
                        studentId: user.id,
                        examType: examMode,
                        answers,
                        assessorMarks: autoGrades,
                        totalScore: totalScore, // v86.1: Added Total Score field for reporting
                        evidence: finalEvidence,
                        durationSec: durationSec,
                        submittedAt: new Date().toISOString()
                    };

                    // 5. Save and Sync
                    await window.Utils.saveResponse(respObj);

                    // Give extra moment before sync to ensure everything is flushed
                    await new Promise(r => setTimeout(r, 1000));

                    // Scoped upload (Critical for reliability)
                    const filterByStudent = (item) => String(item.studentId || '').trim() === String(user.id || '').trim();
                    await window.Utils.uploadToCloud(false, 'responses', filterByStudent);

                    const totalPhotos = finalEvidence.filter(e => e.type && (e.type.includes('PHOTO') || e.type.includes('MANUAL') || e.type.includes('SNAPSHOT'))).length;

                    // v86.3: END EXAM BEFORE ALERT (Ensures camera light turns off immediately)
                    endExam();

                    alert(`Exam Submitted Successfully!\n\nSummary: \n - Duration: ${durationSec}s\n - Evidence Items: ${finalEvidence.length}\n - Photos: ${totalPhotos}`);

                } catch (e) {
                    console.error("Submit Failed", e);
                    alert("Submission error: " + e.message + ". Data saved locally.");

                }
            };


            if (examMode) {

                            <ul className="text-sm text-red-600 list-disc pl-5 max-h-48 overflow-y-auto">
                                {proctoringLogs.map((l, i) => <li key={i}>{l}</li>)}
                            </ul>
                        </div>
                    </div>
                );

                if (examMode === 'VivaWait') return (
                    <div className="flex h-screen fixed inset-0 z-50 bg-white flex-col items-center justify-center text-center p-8 box-border text-gray-900 animate-fade-in overflow-hidden">
                        {/* Decorative Background */}

                        </div>

                            <div className="w-36 h-36 bg-primary-50 rounded-4xl flex items-center justify-center mx-auto mb-10 border-2 border-primary-100 shadow-[0_20px_40px_rgba(139,92,246,0.15)] animate-pulse relative">
                                <Icons.Video className="w-16 h-16 text-primary-600" />
                                <div className="absolute -top-2 -right-2 w-6 h-6 bg-rose-500 rounded-full border-4 border-white animate-ping"></div>
                            </div>

                            <h1 className="text-5xl font-extrabold mb-4 tracking-tighter text-gray-900">Live Lobby</h1>
                            <p className="text-xl text-gray-600 mb-10 font-medium">Please wait. The assessor will admit you to the assessment room shortly.</p>

                            <div className="glass p-4 rounded-2xl mb-12 flex items-center justify-between border border-gray-200 shadow-sm">
                                <div className="flex items-center gap-3">
                                    <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                                    <span className="text-xs font-bold text-gray-600 uppercase tracking-widest">Connection Stable</span>
                                </div>
                                <div className="px-3 py-1 bg-gray-50 border border-gray-100 rounded-lg font-mono text-[10px] text-gray-900">
                                    ROOM: {user.batchId?.slice(-6)}_{user.id?.slice(-4)}

                                    <Icons.ArrowRightCircle className="w-6 h-6" /> Join Now (Force)

                if (examMode === 'VivaLive') return (

                                {remoteStream ? (

                                ) : (

                                                    const newEvidence = [...verificationEvidence, {
                                                        img, type, time: new Date().toISOString(),
                                                        studentId: user.id, batchId: user.batchId
                                                    }];
                                                    setVerificationEvidence(newEvidence);

                                                    if (verificationStep === 'SELFIE') {
                                                        setVerificationStep('ID_CARD');
                                                    } else {
                                                        setVerificationStep('DETAILS');
                                                    }
                                                }}
                                                instructions={verificationStep === 'SELFIE' ?
                                                    "Keep your face within the highlighted area." :
                                                    "Position your ID Card next to your face."}
                                            />
                                            {/* Scan Effect Overlay */}
                                            <div className="absolute inset-0 pointer-events-none border-2 border-primary-500/20 rounded-3xl overflow-hidden">
                                                <div className="w-full h-1 bg-gradient-to-r from-transparent via-primary-500 to-transparent absolute top-0 animate-[scan_3s_linear_infinite] opacity-50"></div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* DETAILS STEP */}
                                {verificationStep === 'DETAILS' && (
                                    <div className="p-8 pt-4 space-y-8 overflow-y-auto">
                                        <div className="bg-secondary-50 p-6 rounded-3xl border border-secondary-100">
                                            <div className="flex items-center gap-3 mb-6">
                                                <div className="p-2 bg-white rounded-xl shadow-sm">
                                                    <Icons.UserPen className="w-5 h-5 text-primary-500" />
                                                </div>
                                                <p className="font-bold text-secondary-700">Please verify your identification details</p>
                                            </div>
                                            <div className="space-y-6">
                                                <div>
                                                    <label className="block text-[11px] font-black text-secondary-700 uppercase tracking-widest mb-2 px-1">Father's Name</label>
                                                    <input
                                                        type="text"
                                                        className="w-full bg-white border border-secondary-200 p-4 rounded-2xl focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 outline-none transition-all font-medium placeholder:text-secondary-300"
                                                        value={verificationDetails.fatherName}
                                                        onChange={e => setVerificationDetails({ ...verificationDetails, fatherName: e.target.value })}
                                                        placeholder="As per ID Card"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-[11px] font-black text-secondary-700 uppercase tracking-widest mb-2 px-1">Aadhar Number</label>
                                                    <input
                                                        type="text"
                                                        className="w-full bg-white border border-secondary-200 p-4 rounded-2xl focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 outline-none transition-all font-medium placeholder:text-secondary-300 tracking-[0.2em]"
                                                        value={verificationDetails.aadharNumber}
                                                        onChange={e => setVerificationDetails({ ...verificationDetails, aadharNumber: e.target.value })}
                                                        placeholder="0000 0000 0000"
                                                        maxLength={12}
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                        <button
                                            onClick={() => {
                                                if (!verificationDetails.fatherName.trim() || !verificationDetails.aadharNumber.trim()) {
                                                    alert("Please fill all required fields."); return;
                                                }
                                                if (verificationDetails.aadharNumber.length < 12) {
                                                    alert("Please enter a valid 12-digit Aadhar Number."); return;
                                                }
                                                setVerificationStep('INSTRUCTIONS');
                                            }}
                                            className="w-full bg-primary-600 hover:bg-primary-700 text-gray-900 py-5 rounded-3xl font-black text-lg shadow-2xl shadow-primary-900/30 transition-all hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-3"
                                        >
                                            Proceed to Instructions <Icons.ArrowRight className="w-6 h-6" />
                                        </button>
                                    </div>
                                )}

                                {/* INSTRUCTIONS STEP */}
                                {verificationStep === 'INSTRUCTIONS' && (
                                    <div className="p-8 pt-4 space-y-8 overflow-y-auto">
                                        <div className="space-y-4">
                                            {[
                                                { icon: <Icons.Ban />, title: "No Malpractice", desc: "Use of mobile phones or external aids is strictly prohibited." },
                                                { icon: <Icons.UserCheck />, title: "Stay in Frame", desc: "Ensure your face is clearly visible to the AI proctor at all times." },
                                                { icon: <Icons.MonitorSmartphone />, title: "No Tab Swapping", desc: "Swapping tabs or minimizing the browser will lead to auto-lock." },
                                                { icon: <Icons.Wifi />, title: "Stable Network", desc: "Ensure a stable connection. Progress is saved automatically." }
                                            ].map((item, idx) => (
                                                <div key={idx} className="flex gap-4 p-4 rounded-2xl hover:bg-secondary-50 transition-colors border border-transparent hover:border-secondary-100 group">
                                                    <div className="w-12 h-12 rounded-xl bg-secondary-100 flex items-center justify-center text-secondary-600 group-hover:bg-primary-100 group-hover:text-primary-600 transition-colors shrink-0">
                                                        {React.cloneElement(item.icon, { className: "w-6 h-6" })}
                                                    </div>
                                                    <div>
                                                        <h4 className="font-bold text-secondary-900">{item.title}</h4>
                                                        <p className="text-sm text-secondary-800">{item.desc}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="bg-amber-50 border border-amber-100 p-6 rounded-3xl">
                                            <div className="flex items-center gap-3 text-amber-800 font-bold mb-2">
                                                <Icons.ShieldAlert className="w-5 h-5" />
                                                <span>Candidate Agreement</span>
                                            </div>
                                            <p className="text-xs text-amber-700 leading-relaxed">
                                                I hereby declare that I will follow all rules and maintain assessment integrity. I understand that any violation will result in immediate disqualification.
                                            </p>
                                        </div>

                                        <button
                                            onClick={() => {
                                                // Save Evidence
                                                window.Utils.saveResponse({
                                                    studentId: user.id,
                                                    examType: 'VERIFICATION',
                                                    forExamType: pendingExamMode, // which exam this verification belongs to
                                                    evidence: verificationEvidence,
                                                    details: verificationDetails,
                                                    submittedAt: new Date().toISOString()
                                                });

                                                // v86.2: CALL THE START LOGIC
                                                startExam('VERIFIED_START');
                                            }}
                                            className="w-full bg-emerald-600 hover:bg-emerald-700 text-gray-900 py-5 rounded-3xl font-black text-lg shadow-2xl shadow-emerald-900/30 transition-all hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-3"
                                        >
                                            AGREE & START EXAM <Icons.PlayCircle className="w-6 h-6" />
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </>
            );
        };

        // ASSESSOR PORTAL
        const AssessorPortal = ({ user }) => {
            const [view, setView] = useState('dashboard'); // dashboard, batches, students, exam_type, capture
            const [flowMode, setFlowMode] = useState('MANUAL'); // 'MANUAL' or 'VIVA'

            // Workflow State
            const [selectedBatch, setSelectedBatch] = useState(null);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [selectedExamType, setSelectedExamType] = useState(null);

            // Data
            const [batches, setBatches] = useState([]);
            const [batchStudents, setBatchStudents] = useState([]);
            const [allQPapers, setAllQPapers] = useState([]);
            const [showVivaLobby, setShowVivaLobby] = useState(false);

            useEffect(() => {
                // Initialize Data
                setBatches(window.Utils.getBatches());
                setAllQPapers(window.Utils.getQuestionPapers());
            }, []);

            // Effect to load students when batch changes
            useEffect(() => {
                if (selectedBatch) {
                    setBatchStudents(window.Utils.getStudentsByBatch(selectedBatch.id));
                }
            }, [selectedBatch]);

            if (showVivaLobby) return <VivaLobby batch={selectedBatch || user} onClose={() => setShowVivaLobby(false)} />;

            // VIEW 1: DASHBOARD
            if (view === 'dashboard') {
                return (
                    <div className="p-8">
                        <h2 className="text-2xl font-bold mb-6">Assessor Dashboard</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <button onClick={() => { setFlowMode('MANUAL'); setView('batches'); }} className="h-48 bg-white rounded shadow hover:shadow-xl transition-all border-l-8 border-indigo-600 flex flex-col items-center justify-center gap-4 group">
                                <div className="bg-indigo-100 p-4 rounded-full group-hover:bg-indigo-200 transition-colors">
                                    <Icons.FileText className="w-12 h-12 text-indigo-700" />
                                </div>
                                <div className="text-center">
                                    <h3 className="text-xl font-bold text-gray-800">Capture Evidence</h3>
                                    <p className="text-gray-800">Capture photos & videos</p>
                                </div>
                            </button>

                            <button onClick={() => { setFlowMode('VIVA'); setView('batches'); }} className="h-48 bg-white rounded shadow hover:shadow-xl transition-all border-l-8 border-green-600 flex flex-col items-center justify-center gap-4 group">
                                <div className="bg-green-100 p-4 rounded-full group-hover:bg-green-200 transition-colors">
                                    <Icons.Video className="w-12 h-12 text-green-700" />
                                </div>
                                <div className="text-center">
                                    <h3 className="text-xl font-bold text-gray-800">Live Viva Lobby</h3>
                                    <p className="text-gray-800">Join virtual assessment room</p>
                                </div>
                            </button>
                        </div>



                    </div>
                );
            }


            // VIEW 2: SELECT BATCH (Common for both flows)
            if (view === 'batches') {
                return (
                    <div className="p-8">
                        <button onClick={() => setView('dashboard')} className="mb-6 text-gray-800 hover:text-gray-800 flex items-center gap-1 font-bold text-lg">&larr; Back to Dashboard</button>
                        <h2 className="text-2xl font-bold mb-6">Select Batch for {flowMode === 'MANUAL' ? 'Capture Evidence' : 'Viva'}</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {batches.map(batch => (
                                <div key={batch.id} onClick={() => {
                                    setSelectedBatch(batch);
                                    if (flowMode === 'MANUAL') setView('exam_type'); // Manual: Batch -> Exam Type
                                    else { setShowVivaLobby(true); } // Viva: Batch -> Lobby (Zoom)
                                }}
                                    className="bg-white p-6 rounded shadow cursor-pointer hover:border-indigo-500 border-2 border-transparent transition-all">
                                    <h3 className="font-bold text-lg mb-1">{String(batch.name)}</h3>
                                    <p className="text-xs text-gray-800 mb-4">ID: {String(batch.batchId || batch.id)}</p>
                                    <div className="flex items-center gap-2 text-sm text-gray-600">
                                        <span>{window.Utils.getStudentsByBatch(batch.id).length} Students</span>
                                    </div>
                                </div>
                            ))}
                            {batches.length === 0 && <p className="text-gray-800">No batches found.</p>}
                        </div>
                    </div>
                );
            }

            // VIEW 3: SELECT STUDENT (Moved before Exam Type as requested)
            if (view === 'students') {
                return (
                    <div className="p-8">
                        <button onClick={() => setView('exam_type')} className="mb-6 text-gray-800 hover:text-gray-800 flex items-center gap-1 font-bold text-lg">&larr; Back to Exam Type</button>
                        <h2 className="text-2xl font-bold mb-2">Select Student for {selectedExamType}</h2>
                        <div className="flex gap-2 mb-6 text-sm">
                            <span className="bg-gray-200 px-2 py-1 rounded text-gray-700">{selectedBatch.name}</span>
                            <span className="bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-bold">{selectedExamType}</span>
                        </div>

                        <div className="bg-white rounded shadow text-sm">
                            <div className="p-4 border-b font-bold bg-gray-50 flex justify-between">
                                <span>Student Name</span>
                                <span>Action</span>
                            </div>
                            {batchStudents.map(s => (
                                <div key={s.id} onClick={() => { setSelectedStudent(s); setView('capture'); }}
                                    className="p-4 border-b hover:bg-indigo-50 cursor-pointer flex justify-between items-center group transition-colors">
                                    <div className="flex items-center gap-3">
                                        <div className="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center font-bold group-hover:bg-indigo-200 group-hover:text-indigo-700 transition-colors">
                                            {s.name.charAt(0)}
                                        </div>
                                        <div>
                                            <p className="font-medium">{s.name}</p>
                                            <p className="text-xs text-gray-700">{s.username}</p>
                                        </div>
                                    </div>
                                    <span className="text-indigo-600 font-bold opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">
                                        <Icons.ChevronRight className="w-4 h-4" /> Select
                                    </span>
                                </div>
                            ))}
                            {batchStudents.length === 0 && <p className="p-8 text-center text-gray-800">No students found in this batch.</p>}
                        </div>
                    </div>
                );
            }

            // VIEW 4: SELECT EXAM TYPE (Moved after Student as requested)
            if (view === 'exam_type') {
                return (
                    <div className="p-8">
                        <button onClick={() => setView('batches')} className="mb-6 text-gray-800 hover:text-gray-800 flex items-center gap-1 font-bold text-lg">&larr; Back to Batches</button>
                        <h2 className="text-2xl font-bold mb-2">Select Assessment Type</h2>
                        <div className="flex gap-2 mb-6 text-sm">
                            <span className="bg-gray-200 px-2 py-1 rounded text-gray-700">{selectedBatch.name}</span>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {['Theory', 'Practical', 'Viva'].map(type => (
                                <button key={type} onClick={() => { setSelectedExamType(type); setView('students'); }}
                                    className="bg-white p-8 rounded shadow hover:shadow-lg transition-all text-left group border-t-4 border-indigo-500">
                                    <h3 className="text-xl font-bold group-hover:text-indigo-600 transition-colors mb-2">{type}</h3>
                                    <p className="text-sm text-gray-800">Capture evidence for {type}.</p>
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }

            // VIEW 5: CAPTURE INTERFACE (StudentGradingView)
            if (view === 'capture') {
                return (
                    <div className="p-8">
                        <StudentGradingView
                            student={selectedStudent}
                            batch={selectedBatch}
                            examType={selectedExamType}
                            allQPapers={allQPapers}
                            onBack={() => setView('students')}
                            captureOnly={true} // Hide grading controls
                        />
                    </div>
                );
            }

            return <div>Unknown View</div>;
        };


        // SYNC STATUS HUD COMPONENT (v17.15)
        const SyncStatusHUD = () => {
            React.useEffect(() => {
                const el = document.getElementById('sync-status-text');
                if (!el) return;

                // Watch for text changes
                const observer = new MutationObserver(() => {
                    const text = el.innerText;
                    if (text && text.trim().length > 0) {
                        el.classList.remove('translate-y-24', 'opacity-0');
                        // Auto-hide after success
                        if (text.includes('Synced') || text.includes('Complete')) {
                            setTimeout(() => {
                                el.classList.add('translate-y-24', 'opacity-0');
                                // Optional: clear text after animation
                                setTimeout(() => el.innerText = '', 500);
                            }, 3000);
                        }
                    } else {
                        el.classList.add('translate-y-24', 'opacity-0');
                    }
                });

                observer.observe(el, { characterData: true, childList: true, subtree: true });
                return () => observer.disconnect();
            }, []);

            return (
                <div id="sync-status-text"
                    className="fixed bottom-6 right-6 bg-white text-gray-900 px-6 py-4 rounded-xl shadow-2xl z-[9999] font-bold transition-all duration-500 transform translate-y-24 opacity-0 flex items-center gap-3 border border-gray-200">
                </div>
            );
        };

        // MAIN APP
        const App = () => {
            const [user, setUser] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('se_user');
                    return saved ? JSON.parse(saved) : null;
                } catch (e) {
                    console.error("Auth Load Error:", e);
                    return null;
                }
            });

            React.useEffect(() => {
                if (!user) return;

                // Initial Sync on Load (Safe v17.12)
                console.log("[Auto-Sync] Re-syncing on Load...");
                window.Utils.downloadFromCloud(true);

                // GLOBAL AUTO-SYNC: Throttled to 60s to prevent race conditions
                const intervalId = setInterval(() => {
                    if (navigator.onLine && user) {
                        console.log("[Auto-Sync] Triggering global sync...");
                        window.Utils.uploadToCloud(true);
                        setTimeout(() => window.Utils.downloadFromCloud(true), 2000); // Wait 2s for upload to settle
                    }
                }, 15000);

                return () => clearInterval(intervalId);
            }, [user]);

            // v52: Global Scheduled Notification Poller (Refactored & Visible)
            React.useEffect(() => {
                if (!user) return;

                const updateStatus = (msg) => {
                    // console.log(`[Scheduler] ${msg}`);
                };

                if (user.role !== 'admin') {
                    return;
                }

                const checkScheduledAlerts = () => {
                    if (!window.Utils.getBatches) return;
                    const batches = window.Utils.getBatches();
                    const now = new Date();

                    const todayStr = now.getFullYear() + '-' +
                        String(now.getMonth() + 1).padStart(2, '0') + '-' +
                        String(now.getDate()).padStart(2, '0');

                    const currentMins = now.getHours() * 60 + now.getMinutes();

                    updateStatus(`v52 Checking ${batches.length} batches...`);

                    let findings = [];
                    batches.forEach(batch => {
                        if (batch.endDate === todayStr && batch.endTime) {
                            const [bH, bM] = batch.endTime.split(':').map(Number);
                            const batchMins = bH * 60 + bM;

                            findings.push(`${batch.name}: ${batch.endTime} (Left: ${batchMins - currentMins}m)`);

                            if (currentMins >= batchMins) {
                                const storageKey = `scheduled_msg_${batch.id}_${todayStr}`;
                                if (!localStorage.getItem(storageKey)) {
                                    console.log(`[Scheduler] !!! TRIGGERED !!! Batch: ${batch.name} at ${batch.endTime}`);

                                    window.Utils.createNotification('ALL_COMPLETED', {
                                        batchId: batch.id,
                                        batchName: batch.name,
                                        examType: 'Batch End',
                                        message: `✅ Batch "${batch.name}" end time (${batch.endTime}) reached. Reporting...`,
                                        actionData: { batchId: batch.id, examType: 'Batch End' }
                                    });

                                    localStorage.setItem(storageKey, 'true');
                                }
                            }
                        }
                    });

                    window.Utils.lastFindings = findings; // For debug button
                };

                window.Utils.testScheduler = () => {
                    checkScheduledAlerts();
                    alert("Scheduler Debug:\n\nToday: " + (new Date().toISOString().split('T')[0]) +
                        "\nBatches found: " + (window.Utils.lastFindings ? window.Utils.lastFindings.join('\n') : "None"));
                };

                const interval = setInterval(checkScheduledAlerts, 20000); // Check every 20s
                checkScheduledAlerts();
                return () => clearInterval(interval);
            }, [user]);

            // v86.2: Global Icon & Layout Initialization
            useEffect(() => {
                const init = () => {
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                };
                init();
                const timer = setTimeout(init, 1000); // Retry after Babel delay
                return () => clearTimeout(timer);
            }, [user]);

            const handleLogin = (u) => {
                localStorage.setItem('se_user', JSON.stringify(u));
                setUser(u);
            };

            const handleLogout = () => {
                localStorage.removeItem('se_user');
                setUser(null);
            };

            return (
                <React.Fragment>
                    {!user ? (
                        <LoginScreen onLogin={handleLogin} />
                    ) : (
                        <React.Fragment>
                            {user.role === 'admin' && <AdminDashboard />}
                            {user.role === 'student' && <StudentPortal user={user} />}
                            {user.role === 'assessor' && <AssessorPortal user={user} />}

                            {/* Global Logout for Safety */}
                            <button
                                onClick={handleLogout}
                                className="fixed bottom-4 left-4 z-[100] bg-red-600 text-white px-4 py-2 rounded-full shadow-lg text-xs font-bold opacity-50 hover:opacity-100 transition-opacity"
                                title="Logout"
                            >
                                <Icons.Lock className="w-4 h-4 inline mr-1" /> Logout
                            </button>

                            <SyncStatusHUD />
                        </React.Fragment>
                    )}
                </React.Fragment>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>

</body>

</html>
